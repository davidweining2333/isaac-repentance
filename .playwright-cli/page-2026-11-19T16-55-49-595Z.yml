        - table [ref=e297]:
          - rowgroup [ref=e298]:
            - row [ref=e299]:
              - cell "“" [ref=e300]
              - cell "当时，耶和华把硫磺与火，从天上耶和华那里降与所多玛和蛾摩拉，把那些城和全平原，城里所有的居民和土地上生长的，都毁灭了。罗得的妻子在他后边回头一看，就变成了一根盐柱。亚伯拉罕清早起来，到了他先前站在耶和华面前的地方，面向所多玛和蛾摩拉，以及平原全地观望。他观看，看哪，那地有浓烟上腾，好像烧窑的浓烟。" [ref=e301]
              - cell "”" [ref=e302]
            - row [ref=e303]:
              - cell "—— 《创世记》第19章第24~28节" [ref=e304]
