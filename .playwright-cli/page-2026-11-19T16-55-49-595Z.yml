            - text: 。
          - listitem [ref=e2181]: “brimstone”（burn stone）一词来源于钦定版圣经（King James Version of the Bible）中提到的“burning sulfur”。它被用在短语“fire and brimstone（硫磺与火）”中，意为“炼狱之苦”。常温下固态硫呈浅黄色，而高温熔融态硫则呈血红色。
          - listitem [ref=e2182]:
            - text: 该道具的图标“🜏（Unicode：U+1F70F）”来源于炼金术中的
            - link "硫磺 " [ref=e2183] [cursor=pointer]:
              - /url: https://en.wikipedia.org/wiki/Alchemical_symbol#Mundane_elements
            - text: ，称作“利维坦十字（The Leviathan Cross）”。撒但教创始人Anton LaVey在撒但圣经中将该图标用作地狱的象征，现在这个图标常常让人联想到恶魔崇拜等信仰。
          - listitem [ref=e2184]:
            - text: 如果玩家在2014年12月10日前预购了《
            - link "以撒的结合：重生" [ref=e2185] [cursor=pointer]:
