                - img "Tears Stat Icon 2.png" [ref=e355]
                - text: 射速成反比。
              - listitem [ref=e356]: 鲜血激光柱具有无限射程，可以穿透敌人和障碍物。
              - listitem [ref=e357]:
                - text: 鲜血激光柱对接触的敌人造成每4帧（每秒15次）
